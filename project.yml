name: NewHampshireEats
options:
  bundleIdPrefix: com.newhampshireeats
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "2"
    DEVELOPMENT_TEAM: "4C8TU6U7MQ"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1,2"  # iPhone and iPad
    SWIFT_STRICT_CONCURRENCY: minimal

targets:
  NewHampshireEats:
    type: application
    platform: iOS
    sources:
      - path: NewHampshireEats
    info:
      path: NewHampshireEats/Info.plist
      properties:
        CFBundleDisplayName: Granite State Eats
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIRequiresFullScreen: false
        UIUserInterfaceStyle: Light      # the palette is light-only (Design/Theme.swift); dark mode made lists unreadable
        NSLocationWhenInUseUsageDescription: "Your location sorts oyster bars, lunch counters and restaurants by distance and shows where you are on the map. It stays on your device."
        ITSAppUsesNonExemptEncryption: false
        LSApplicationQueriesSchemes: [maps]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.newhampshireeats.ios
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    scheme:
      testTargets: [NewHampshireEatsTests, NewHampshireEatsUITests]

  NewHampshireEatsTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: NewHampshireEatsTests
    dependencies:
      - target: NewHampshireEats
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.newhampshireeats.ios.tests
        GENERATE_INFOPLIST_FILE: true

  NewHampshireEatsUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: NewHampshireEatsUITests
    dependencies:
      - target: NewHampshireEats
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.newhampshireeats.ios.uitests
        GENERATE_INFOPLIST_FILE: true
        TEST_TARGET_NAME: NewHampshireEats
